name: Deploy Vite App to GitHub Pages

# 触发条件：当代码推送到 main 分支时
on:
  push:
    branches: [ master ]

# 设置权限，允许写入仓库内容（部署到 gh-pages 分支）
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: 'ssh-rsa  shunhaitang@shunhaideMacBook-Pro.local'
          publish_dir: ./dist